<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>VANTA AI — Video Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f6fb;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:32px 20px 70px}.top{display:flex;align-items:center;gap:12px;margin-bottom:64px}.mark{width:42px;height:42px;border:1px solid #8d7cff;border-radius:13px;display:grid;place-items:center;color:#b7aaff;font-weight:900;letter-spacing:-2px}.brand{font-size:19px;font-weight:800;letter-spacing:3px}.brand small{display:block;font-size:9px;color:#8d91a6;letter-spacing:4px;margin-top:3px}.hero{text-align:center;margin-bottom:36px}.eyebrow{color:#a99cff;letter-spacing:3px;font-size:11px;font-weight:700}h1{font-size:clamp(36px,7vw,66px);line-height:1.03;letter-spacing:-2px;margin:18px 0}.sub{color:#a6aabd;max-width:600px;margin:auto;line-height:1.7}.panel{background:#121522;border:1px solid #282d40;border-radius:22px;padding:24px;max-width:760px;margin:30px auto}label{display:block;color:#d9dbea;font-size:13px;font-weight:700;margin:18px 0 9px}textarea,select{width:100%;background:#0b0e18;color:#fff;border:1px solid #34394e;border-radius:12px;padding:15px;font:inherit}textarea{min-height:145px;resize:vertical;line-height:1.5}select{min-height:48px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{width:100%;border:0;border-radius:12px;background:linear-gradient(100deg,#7865ff,#a16cff);color:white;font-weight:800;font-size:15px;padding:16px;margin-top:22px}button:disabled{opacity:.55}#status{color:#c7c2ff;min-height:26px;margin-top:16px;text-align:center}video{width:100%;border-radius:14px;margin-top:16px;background:#05060a}#result{display:none}.note{color:#858ba2;font-size:12px;line-height:1.6;text-align:center;margin-top:22px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding-top:22px}.top{margin-bottom:46px}.panel{padding:18px}}
</style></head><body><main class="wrap"><header class="top"><div class="mark">AY</div><div class="brand">VANTA<small>AI VIDEO STUDIO</small></div></header>
<section class="hero"><div class="eyebrow">CREATE WITHOUT LIMITS</div><h1>Your imagination.<br>In motion.</h1><p class="sub">Describe a scene and turn your idea into an AI-generated video. Write your prompt in any language.</p></section>
<section class="panel"><label for="prompt">Describe your video</label><textarea id="prompt" maxlength="2000" placeholder="A funny, cinematic talking cockroach interviews people in a busy Istanbul street. Turkish dialogue, realistic camera movement..."></textarea>
<div class="grid"><div><label for="language">Spoken language</label><select id="language"><option>Turkish</option><option>English</option><option>Arabic</option><option>German</option><option>Spanish</option></select></div><div><label for="format">Aspect ratio</label><select id="format"><option value="9:16">Vertical · 9:16</option><option value="16:9">Landscape · 16:9</option><option value="1:1">Square · 1:1</option></select></div></div>
<button id="generate">GENERATE VIDEO</button><div id="status" role="status"></div><div id="result"><video id="video" controls playsinline></video></div><p class="note">Generation uses a third-party AI service and may incur usage charges. Do not submit private or sensitive information.</p></section></main>
<script>
const btn=document.querySelector('#generate'), statusEl=document.querySelector('#status');
btn.addEventListener('click',async()=>{const prompt=document.querySelector('#prompt').value.trim();if(!prompt){statusEl.textContent='Please enter a video description.';return}btn.disabled=true;document.querySelector('#result').style.display='none';try{statusEl.textContent='Submitting your request…';const start=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,language:document.querySelector('#language').value,aspect_ratio:document.querySelector('#format').value})});const job=await start.json();if(!start.ok)throw new Error(job.error||'Could not start generation.');let done=false;while(!done){await new Promise(r=>setTimeout(r,4000));const check=await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status_url:job.status_url,response_url:job.response_url})});const data=await check.json();if(!check.ok)throw new Error(data.error||'Could not check generation status.');if(data.status==='COMPLETED'){if(data.error)throw new Error(data.error);if(!data.video_url)throw new Error('The model completed but did not return a video URL.');document.querySelector('#video').src=data.video_url;document.querySelector('#result').style.display='block';statusEl.textContent='Your video is ready.';done=true}else statusEl.textContent=data.status==='IN_QUEUE'?'Waiting in the generation queue…':'Creating your video…'}}catch(e){statusEl.textContent=e.message}finally{btn.disabled=false}});
</script></body></html>
